<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skeleton FastAPI App</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        main {
            flex: 1;
        }
        footer {
            background: #f0f0f0;
            padding: 1rem;
            text-align: center;
            font-size: 0.8rem;
            border-top: 1px solid #ddd;
        }
        .info-item {
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <main></main>
    <footer>
        <span class="info-item">Health: <span id="health">Loading...</span></span>
        <span class="info-item">Version: <span id="version">Loading...</span></span>
        <span class="info-item">Status: <span id="status">Loading...</span></span>
    </footer>
    <script>
        async function fetchInfo() {
            try {
                const healthRes = await fetch('/healthcheck');
                const healthData = await healthRes.json();
                document.getElementById('health').textContent = healthData.status;

                const versionRes = await fetch('/version');
                const versionData = await versionRes.json();
                document.getElementById('version').textContent = versionData.version;

                const statusRes = await fetch('/status');
                const statusData = await statusRes.json();
                document.getElementById('status').textContent = statusData.status;
            } catch (error) {
                console.error('Error fetching info:', error);
            }
        }
        fetchInfo();
    </script>
</body>
</html>
